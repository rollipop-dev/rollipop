approvedGitRepositories:
  - "**"

catalog:
  es-toolkit: 1.52.0
  typescript: 7.0.2

catalogs:
  devframe:
    devframe: 1.2.6
    "@devframes/agentic": 1.2.6
    "@devframes/hub": 1.2.6
    "@devframes/hub-ui": 1.2.6
  rolldown:
    "@rollipop/rolldown": 1.1.1
  vp:
    vite: npm:@voidzero-dev/vite-plus-core@1.3.0
    vite-plus: 1.3.0
    vitest: 5.0.5
    "@vitest/coverage-v8": 5.0.5

enableScripts: true

logFilters:
  # The Vite+ alias reports its own version instead of the Vite version it implements.
  - pattern: "vite is listed by your project with version *"
    level: discard
  
  # Only use types from expo.
  - pattern: "react (*), requested by expo."
    level: discard
  - pattern: "react-native (*), requested by expo."
    level: discard

nmHoistingLimits: workspaces

nodeLinker: node-modules

npmMinimalAgeGate: 7d

npmPreapprovedPackages:
  - "@rollipop/*"
  # typescript
  - typescript
  - "@typescript/*"
  # react-native
  - "@react-native/*"
  # vite-plus
  - vite-plus
  - "@voidzero-dev/*"
  # oxc
  - "@oxc-project/*"
  # swc
  - "@swc/*"
  # fastify
  - fastify
  - fastify-*
  - "@fastify/*"
  # others
  - rolldown-analyzer
  - source-map
  - es-toolkit
  - vitest
  - '@vitest/*'

npmPublishAccess: public

npmPublishRegistry: "https://registry.npmjs.org"
