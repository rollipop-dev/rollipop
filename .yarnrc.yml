approvedGitRepositories:
  - "**"

catalog:
  es-toolkit: 1.52.0
  typescript: 6.0.3
  vite-plus: 0.3.1
  devframe: 0.9.12
  "@devframes/hub": 0.9.12
  "@devframes/hub-ui": 0.9.12

catalogs:
  rolldown:
    "@rollipop/rolldown": 1.0.30

enableScripts: true

nmHoistingLimits: workspaces

nodeLinker: node-modules

npmMinimalAgeGate: 7d

npmPreapprovedPackages:
  - "@rollipop/*"
  # typescript
  - typescript
  - "@typescript/*"
  # react-native
  - "@react-native/*"
  # vite-plus
  - vite-plus
  - "@voidzero-dev/*"
  # oxc
  - "@oxc-project/*"
  # swc
  - "@swc/*"
  # fastify
  - fastify
  - fastify-*
  - "@fastify/*"
  # others
  - rolldown-analyzer
  - source-map
  - es-toolkit

npmPublishAccess: public

npmPublishRegistry: "https://registry.npmjs.org"

npmRegistries:
  "https://registry.npmjs.org":
    npmAlwaysAuth: true
