approvedGitRepositories:
  - "**"

catalog:
  es-toolkit: 1.52.0
  typescript: 7.0.2

catalogs:
  devframe:
    devframe: 1.0.0
    "@devframes/agentic": 1.0.0
    "@devframes/hub": 1.0.0
    "@devframes/hub-ui": 1.0.0
  rolldown:
    "@rollipop/rolldown": 1.0.32
  vp:
    vite: npm:@voidzero-dev/vite-plus-core@0.3.3
    vite-plus: 0.3.3
    vitest: 4.1.11
    "@vitest/coverage-v8": 4.1.11

enableScripts: true

logFilters:
  # The Vite+ alias reports its own version instead of the Vite version it implements.
  - pattern: "vite is listed by your project with version *"
    level: discard

nmHoistingLimits: workspaces

nodeLinker: node-modules

npmMinimalAgeGate: 7d

npmPreapprovedPackages:
  - "@rollipop/*"
  # typescript
  - typescript
  - "@typescript/*"
  # react-native
  - "@react-native/*"
  # vite-plus
  - vite-plus
  - "@voidzero-dev/*"
  # oxc
  - "@oxc-project/*"
  # swc
  - "@swc/*"
  # fastify
  - fastify
  - fastify-*
  - "@fastify/*"
  # others
  - rolldown-analyzer
  - source-map
  - es-toolkit
  - vitest
  - '@vitest/*'

npmPublishAccess: public

npmPublishRegistry: "https://registry.npmjs.org"

npmRegistries:
  "https://registry.npmjs.org":
    npmAlwaysAuth: true
